# Apache site for smatid_kyc_web. Copy to /etc/apache2/sites-available/dev-kyc.smatid.com.conf,
# change ServerName if you use another name, then: a2enmod headers && a2ensite dev-kyc.smatid.com
# && apache2ctl configtest && systemctl reload apache2 && certbot --apache -d dev-kyc.smatid.com
<VirtualHost *:80>
    ServerName dev-kyc.smatid.com
    DocumentRoot /var/www/smatid-kyc-web/dist

    <Directory /var/www/smatid-kyc-web/dist>
        Options -Indexes
        AllowOverride None
        Require all granted
        # A single-page app: /admin/clients/4 and the like are routes in index.html, not files.
        FallbackResource /index.html
    </Directory>

    # Built files have a content hash in their names, so they can be cached for good;
    # index.html must always be fetched fresh so a new build shows up straight away.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>
    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog ${APACHE_LOG_DIR}/dev-kyc-error.log
    CustomLog ${APACHE_LOG_DIR}/dev-kyc-access.log combined
</VirtualHost>
